---
name: Build

on:
  push:
    branches:
      - chatterino7
      - "bugfix-release/**"
      - "release/*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - nightly
          - stable

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  C2_ENABLE_LTO: ${{ github.ref == 'refs/heads/chatterino7' || startsWith(github.ref, 'refs/heads/bugfix-release') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') }}
  CHATTERINO_REQUIRE_CLEAN_GIT: On
  CHATTERINO_BUILD_TYPE: ${{ case(inputs.buildType != '', inputs.buildType, 'auto') }}
  CONAN_VERSION: 2.28.1
  C2_ARCH: x86-64
  QT_VERSION: 6.7.1

jobs:
  build-windows:
    name: "Build Windows x64 (Qt 6.7.1)"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine build type
        id: build-type
        shell: bash
        run: |
          if [ "${CHATTERINO_BUILD_TYPE}" = "auto" ]; then
            if git describe --exact-match --match 'v*'; then
              echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
            else
              echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${CHATTERINO_BUILD_TYPE}" = "nightly" ]; then
            echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
          else
            echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.5.0
        with:
          cache: true
          cache-key-prefix: Windows-QtCache-6.7.1-v2
          modules: qtimageformats
          version: ${{ env.QT_VERSION }}

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-luckymoltorino-${{ hashFiles('**/conanfile.py') }}-QT6-Release
          path: ~/.conan2/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and Setup Conan
        shell: bash
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan --version
          conan profile detect -f

      - name: Install dependencies (Conan)
        shell: bash
        run: |
          mkdir build
          cd build
          conan install .. \
              -s build_type=Release \
              -c tools.cmake.cmaketoolchain:generator="Ninja" \
              -c "tools.build:cxxflags=['/permissive']" \
              -b missing \
              -c tools.build:jobs=4 \
              --output-folder=. \
              -o with_openssl3=True
          conan cache clean --source --build --download "*"

      - name: Configure & Build
        shell: pwsh
        run: |
          cd build
          cmake `
              -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=ON `
              -DBUILD_WITH_CRASHPAD=Off `
              -DBUILD_TESTS=ON `
              -DCHATTERINO_LTO="$Env:C2_ENABLE_LTO" `
              -DCHATTERINO_NO_AVIF_PLUGIN=ON `
              -DFORCE_JSON_GENERATION=Off `
              -DSKIP_JSON_GENERATION=Off `
              -DCHATTERINO_NIGHTLY_BUILD="${{ steps.build-type.outputs.NIGHTLY_BUILD }}" `
              -DCHATTERINO_SPELLCHECK=On `
              -DMOLTORINO_VELOPACK=Off `
              ..
          cmake --build . --target chatterino moltorino-watch-drops-test --parallel 4

      - name: Run Watch & Drops Tests
        shell: cmd
        working-directory: build
        run: |
          call conanrun.bat
          set "QT_QPA_PLATFORM=minimal"
          set "PATH=%CD%\bin;%PATH%"
          bin\moltorino-watch-drops-test.exe

      - name: Prepare portable package
        shell: cmd
        working-directory: build
        run: |
          call conanrun.bat
          if not exist LuckyMoltorino7 mkdir LuckyMoltorino7
          copy /Y bin\LuckyMoltorino7.exe LuckyMoltorino7\
          if exist bin\support xcopy /E /I /Y bin\support LuckyMoltorino7\support
          if exist bin\licenses xcopy /E /I /Y bin\licenses LuckyMoltorino7\licenses
          for /f "delims=" %%F in ('where libcrypto-3-x64.dll 2^>nul') do copy /Y "%%F" LuckyMoltorino7\
          for /f "delims=" %%F in ('where libssl-3-x64.dll 2^>nul') do copy /Y "%%F" LuckyMoltorino7\
          windeployqt LuckyMoltorino7\LuckyMoltorino7.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir LuckyMoltorino7\ --force-openssl
          powershell -NoProfile -ExecutionPolicy Bypass -File ..\.CI\deploy-crt.ps1 LuckyMoltorino7 -Architecture x64
          7z a LuckyMoltorino7-windows-x64.zip LuckyMoltorino7\

      - name: Upload artifact (LuckyMoltorino7 Windows x64)
        uses: actions/upload-artifact@v7
        with:
          name: LuckyMoltorino7-windows-x64.zip
          path: build/LuckyMoltorino7-windows-x64.zip
